<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Camadas lógicas do PCRM</title>
  <desc id="desc">Organização das responsabilidades do software, do dado da aplicação ao hardware de rádio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d35"/></linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Responsabilidades separadas por camadas</text>
  <text x="60" y="96" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Mesmo em um único arquivo .ino, cada bloco do código resolve um problema diferente.</text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="145" width="960" height="58" rx="14" fill="url(#layer)"/><text x="600" y="182" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">APLICAÇÃO — temperatura, umidade e eventos</text>
    <rect x="120" y="225" width="960" height="58" rx="14" fill="#2563eb"/><text x="600" y="262" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">PROTOCOLO — campos, tipos, ID_DADO e status</text>
    <rect x="120" y="305" width="960" height="58" rx="14" fill="#1e40af"/><text x="600" y="342" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">ROTEAMENTO — rota, próximo salto, TTL e duplicatas</text>
    <rect x="120" y="385" width="960" height="58" rx="14" fill="#1e3a8a"/><text x="600" y="422" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">CONFIABILIDADE — ACK final, timeout, fila e retry</text>
    <rect x="120" y="465" width="960" height="58" rx="14" fill="#172554"/><text x="600" y="502" text-anchor="middle" fill="#dbeafe" font-size="20" font-weight="700">RÁDIO / HARDWARE — SX1262, ESP32-S3, antena e GPIO</text>
    <path d="M600 535 L600 590" stroke="#67e8f9" stroke-width="3"/><text x="600" y="620" text-anchor="middle" fill="#94a3b8" font-size="16">o pacote desce pelas responsabilidades e o sinal chega ao rádio</text>
  </g>
</svg>
