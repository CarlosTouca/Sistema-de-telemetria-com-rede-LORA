<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Caminho da informação até a dashboard</title>
  <desc id="desc">Sensores enviam dados pela mesh LoRa até o gateway; o gateway disponibiliza a dashboard por Wi-Fi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d35"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">LoRa transporta; Wi-Fi disponibiliza</text>
  <text x="60" y="96" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">A dashboard não transforma o projeto em uma rede Wi-Fi: ela é a interface local do gateway.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 190)"><rect width="170" height="170" rx="18" fill="#172640" stroke="#38bdf8" stroke-width="2"/><circle cx="85" cy="65" r="28" fill="#1d4ed8"/><text x="85" y="72" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">NÓ</text><text x="85" y="116" text-anchor="middle" fill="#cbd5e1" font-size="16">sensor +</text><text x="85" y="140" text-anchor="middle" fill="#cbd5e1" font-size="16">ESP32</text></g>
    <g transform="translate(315 190)"><rect width="170" height="170" rx="18" fill="#172640" stroke="#38bdf8" stroke-width="2"/><circle cx="85" cy="65" r="28" fill="#334155"/><text x="85" y="72" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">MESH</text><text x="85" y="116" text-anchor="middle" fill="#cbd5e1" font-size="16">roteamento</text><text x="85" y="140" text-anchor="middle" fill="#cbd5e1" font-size="16">LoRa</text></g>
    <g transform="translate(550 190)"><rect width="190" height="170" rx="18" fill="#172640" stroke="#f59e0b" stroke-width="2"/><circle cx="95" cy="65" r="28" fill="#f59e0b"/><text x="95" y="72" text-anchor="middle" fill="#0b1220" font-size="16" font-weight="700">GW</text><text x="95" y="116" text-anchor="middle" fill="#cbd5e1" font-size="16">gateway</text><text x="95" y="140" text-anchor="middle" fill="#cbd5e1" font-size="16">HTTP/AP</text></g>
    <g transform="translate(805 160)"><rect width="300" height="230" rx="18" fill="#172640" stroke="#4ade80" stroke-width="2"/><rect x="42" y="40" width="216" height="120" rx="8" fill="#0b1220" stroke="#64748b" stroke-width="2"/><polyline points="58,130 92,112 120,125 150,80 190,98 232,65" fill="none" stroke="#4ade80" stroke-width="4"/><line x1="58" y1="138" x2="235" y2="138" stroke="#334155"/><line x1="58" y1="70" x2="58" y2="138" stroke="#334155"/><text x="150" y="192" text-anchor="middle" fill="#cbd5e1" font-size="18" font-weight="700">navegador</text><text x="150" y="218" text-anchor="middle" fill="#94a3b8" font-size="16">dashboard local</text></g>
    <line x1="250" y1="275" x2="305" y2="275" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><line x1="485" y1="275" x2="540" y2="275" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/><line x1="740" y1="275" x2="795" y2="275" stroke="#4ade80" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="278" y="245" text-anchor="middle" fill="#67e8f9" font-size="15">LoRa</text><text x="513" y="245" text-anchor="middle" fill="#67e8f9" font-size="15">LoRa</text><text x="768" y="245" text-anchor="middle" fill="#86efac" font-size="15">Wi-Fi / HTTP</text>
  </g>
</svg>
