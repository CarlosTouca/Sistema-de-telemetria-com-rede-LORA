<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Comparação entre ponto a ponto, estrela e mesh</title>
  <desc id="desc">Três topologias de comunicação LoRa usadas na evolução do PCRM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d35"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172640"/><stop offset="1" stop-color="#0f1a2d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Evolução da arquitetura de comunicação</text>
  <text x="60" y="96" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">O mesmo rádio pode participar de topologias diferentes; a topologia depende da lógica de rede.</text>
  <g transform="translate(45 135)" filter="url(#shadow)">
    <rect width="350" height="350" rx="20" fill="url(#panel)" stroke="#334155"/>
    <text x="175" y="42" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700">PONTO A PONTO</text>
    <line x1="110" y1="180" x2="240" y2="180" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 9"/>
    <circle cx="100" cy="180" r="40" fill="#1d4ed8" stroke="#67e8f9" stroke-width="3"/><circle cx="250" cy="180" r="40" fill="#1d4ed8" stroke="#67e8f9" stroke-width="3"/>
    <text x="100" y="186" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">A</text><text x="250" y="186" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">B</text>
    <text x="175" y="248" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">enlace direto</text>
    <text x="175" y="281" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="15">sem relay</text>
  </g>
  <g transform="translate(425 135)" filter="url(#shadow)">
    <rect width="350" height="350" rx="20" fill="url(#panel)" stroke="#334155"/>
    <text x="175" y="42" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700">ESTRELA</text>
    <g stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8"><line x1="175" y1="172" x2="80" y2="100"/><line x1="175" y1="172" x2="270" y2="100"/><line x1="175" y1="172" x2="80" y2="250"/><line x1="175" y1="172" x2="270" y2="250"/></g>
    <circle cx="175" cy="172" r="46" fill="#f59e0b" stroke="#fde68a" stroke-width="3"/><text x="175" y="178" text-anchor="middle" fill="#0b1220" font-family="Arial, sans-serif" font-size="16" font-weight="700">CENTRAL</text>
    <circle cx="80" cy="100" r="27" fill="#1d4ed8"/><circle cx="270" cy="100" r="27" fill="#1d4ed8"/><circle cx="80" cy="250" r="27" fill="#1d4ed8"/><circle cx="270" cy="250" r="27" fill="#1d4ed8"/>
    <text x="80" y="106" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15">N1</text><text x="270" y="106" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15">N2</text><text x="80" y="256" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15">N3</text><text x="270" y="256" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15">N4</text>
    <text x="175" y="305" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">todos dependem da central</text>
  </g>
  <g transform="translate(805 135)" filter="url(#shadow)">
    <rect width="350" height="350" rx="20" fill="url(#panel)" stroke="#334155"/>
    <text x="175" y="42" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700">MESH</text>
    <g stroke="#38bdf8" stroke-width="3"><line x1="85" y1="115" x2="175" y2="82"/><line x1="175" y1="82" x2="270" y2="125"/><line x1="85" y1="115" x2="100" y2="245"/><line x1="100" y1="245" x2="225" y2="260"/><line x1="225" y1="260" x2="270" y2="125"/><line x1="175" y1="82" x2="225" y2="260"/></g>
    <g fill="#1d4ed8" stroke="#67e8f9" stroke-width="3"><circle cx="85" cy="115" r="27"/><circle cx="175" cy="82" r="27"/><circle cx="270" cy="125" r="27"/><circle cx="100" cy="245" r="27"/><circle cx="225" cy="260" r="27"/></g>
    <text x="85" y="121" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">N1</text><text x="175" y="88" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">N2</text><text x="270" y="131" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">N3</text><text x="100" y="251" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">N4</text><text x="225" y="266" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14">N5</text>
    <text x="175" y="305" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">rotas aprendidas em execução</text>
  </g>
</svg>
